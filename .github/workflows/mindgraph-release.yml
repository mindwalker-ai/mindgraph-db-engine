name: MindGraph Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: mindgraph-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mindwalker-ai/mindgraph-db-engine

jobs:
  release:
    name: Build, attest, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(tr -d '[:space:]' < MINDGRAPH_VERSION)"
          test "$RELEASE_TAG" = "$expected" || {
            echo "tag $RELEASE_TAG does not match MINDGRAPH_VERSION $expected" >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release tag must point to a commit already merged into main" >&2
            exit 1
          }
          ./scripts/mindgraph/verify-baseline.sh

      - name: Build release archives and SBOM
        run: ./scripts/mindgraph/stage-release.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mindgraph-release-${{ github.ref_name }}
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/**

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Resolve build context
        id: versions
        run: |
          maven_version="$(awk -F= '$1 == "upstream.mavenVersion" { print $2 }' .mindgraph/baseline.properties)"
          echo "maven=$maven_version" >> "$GITHUB_OUTPUT"
          echo "mindgraph=$(tr -d '[:space:]' < MINDGRAPH_VERSION)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(awk -F= '$1 == "upstream.baseCommit" { print $2 }' .mindgraph/baseline.properties)" >> "$GITHUB_OUTPUT"

      - name: Build and push OCI image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: package/target/arcadedb-${{ steps.versions.outputs.maven }}.dir
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            MINDGRAPH_VERSION=${{ steps.versions.outputs.mindgraph }}
            MINDGRAPH_SOURCE_COMMIT=${{ github.sha }}
            UPSTREAM_COMMIT=${{ steps.versions.outputs.upstream }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign OCI image with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "MindGraph DB Engine $GITHUB_REF_NAME"
